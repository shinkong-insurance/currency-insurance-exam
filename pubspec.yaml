name: currency_insurance_exam
description: 外幣保險資格測驗學習 APP(網頁版)

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.5.0
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  open_file: ^3.3.2
  path_provider: ^2.1.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/guide/
    - assets/images/chapters/
    - assets/guides/
    - assets/json/
